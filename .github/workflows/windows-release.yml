name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      cloud_sync:
        description: 'Build the authenticated Supabase-connected Windows edition'
        required: true
        type: boolean
        default: false
      security_review_complete:
        description: 'Confirm owner account and member-only RLS were verified before cloud desktop build'
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # This client build intentionally has its own local workspace.
      # Do not enable live cloud sync until authenticated desktop sync is tested.
      VITE_CLIENT_RELEASE: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out Vinay Traders
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Run regression tests
        run: npm run test
      - name: Compile Windows NSIS and portable EXE
        shell: pwsh
        run: |
          if ('${{ inputs.cloud_sync }}' -eq 'true') {
            if ('${{ inputs.security_review_complete }}' -ne 'true') { throw 'Cloud desktop build blocked: owner/RLS review not confirmed.' }
            if (-not $env:VITE_SUPABASE_URL -or -not $env:VITE_SUPABASE_PUBLISHABLE_KEY) { throw 'Missing Supabase build variables for cloud desktop.' }
            $env:VITE_CLIENT_RELEASE = 'false'
            npm run desktop:cloud:build
          } else {
            npm run desktop:build
          }
      - name: Verify packaged executables
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path 're fin' -Filter '*.exe' -File
          if ($files.Count -lt 1) { throw 'Windows EXE output not found in re fin.' }
          $files | ForEach-Object { Write-Host "Built: $($_.Name)  ($($_.Length) bytes)" }
      - name: Upload unsigned EXE files
        uses: actions/upload-artifact@v4
        with:
          name: vinay-traders-windows-exe
          path: 're fin/*.exe'
          if-no-files-found: error
          retention-days: 14
