name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # This client build intentionally has its own local workspace.
      # Do not enable live cloud sync until authenticated desktop sync is tested.
      VITE_CLIENT_RELEASE: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out Vinay Traders
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Run regression tests
        run: npm run test
      - name: Compile Windows NSIS and portable EXE
        run: npm run desktop:build
      - name: Verify packaged executables
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path 're fin' -Filter '*.exe' -File
          if ($files.Count -lt 1) { throw 'Windows EXE output not found in re fin.' }
          $files | ForEach-Object { Write-Host "Built: $($_.Name)  ($($_.Length) bytes)" }
      - name: Upload unsigned EXE files
        uses: actions/upload-artifact@v4
        with:
          name: vinay-traders-windows-exe
          path: 're fin/*.exe'
          if-no-files-found: error
          retention-days: 14
