name: Deploy Vinay Traders Web (manual)

on:
  workflow_dispatch:
    inputs:
      security_review_complete:
        description: 'Confirm database backup, authenticated owner login and secure RLS have been verified'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cloudflare:
    if: ${{ inputs.security_review_complete == true }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out approved main code
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check deployment configuration
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Cloudflare token not configured'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Cloudflare account not configured'; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo 'Supabase URL not configured'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Supabase publishable key not configured'; exit 1; }
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Accounting regression tests
        run: npm run test
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy

# No automatic deploy: the production workspace's RLS must be secured and verified first.
