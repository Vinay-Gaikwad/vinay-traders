name: Visual UI Smoke Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui-smoke.yml'
      - 'tests/e2e/**'
      - 'playwright.config.ts'

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_CLIENT_RELEASE: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build static app for visual smoke test
        run: npm run client:build
      - name: Run responsive browser smoke tests
        run: npx playwright test
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vinay-traders-responsive-screenshots
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

# This workflow uses local test data and never connects to production Supabase.
# Re-run after fixing Supabase PromiseLike compile compatibility.
